<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fdf3f6;--g1:#fbdce8;--surface:#fff;--ink:#3a1f33;--mute:#86687a;--line:#f0d4df;--pri:#b83d78;--pri-ink:#fff;--soft:#fbe3ec;--hot:#6b2d5c;--hot-ink:#fff;--ok:#1d7a4a;--bad:#b3392f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1018;--g1:#341a28;--surface:#2b1823;--ink:#f7e6ee;--mute:#c9a3b6;--line:#4a2c3d;--pri:#f08ab5;--pri-ink:#3a0f26;--soft:#3a2230;--hot:#e9a6c6;--hot-ink:#3a0f26;--ok:#5fd093;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#1f1018;--g1:#341a28;--surface:#2b1823;--ink:#f7e6ee;--mute:#c9a3b6;--line:#4a2c3d;--pri:#f08ab5;--pri-ink:#3a0f26;--soft:#3a2230;--hot:#e9a6c6;--hot-ink:#3a0f26;--ok:#5fd093;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:linear-gradient(180deg,var(--g1) 0,var(--bg) 300px) no-repeat,var(--bg);min-height:100vh;color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;font-size:15px}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 56px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:26px;font-weight:900;letter-spacing:-.03em;margin:0}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute);letter-spacing:0;margin-top:2px}
h2{font-size:18px;margin:0 0 10px;font-weight:700}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:500;padding:7px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;color:var(--mute);font:inherit;font-weight:500;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pri);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 20px -12px rgba(107,45,92,.45)}
.grid{display:flex;flex-wrap:wrap;gap:8px}.grid>div{flex:1 1 100%;max-width:420px;min-width:0}
.reg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
@media (max-width:560px){.reg{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px;font-weight:500}
input,select,textarea{width:100%;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
select:disabled{opacity:.5}
.btn{border:0;background:var(--pri);color:var(--pri-ink);font:inherit;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tag{font-size:12px;background:var(--soft);padding:2px 9px;border-radius:999px;font-weight:500}
.tag.hot{background:var(--hot);color:var(--hot-ink);font-weight:700}
.tag.ok{color:var(--ok)}
.pay{font-weight:900;font-size:18px}
.mute{color:var(--mute);font-size:13px}
.sub{margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
.rec{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:14px}
.bar{height:6px;border-radius:3px;background:var(--soft);width:80px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%;background:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.chk{display:inline-flex;gap:4px;align-items:center;margin-right:12px;color:var(--ink);font-size:14px}.chk input{width:auto}
input[type=date],input[type=time],input[type=month]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-height:36px;line-height:1.4}
.empty{text-align:center;color:var(--mute);padding:26px 8px}
.note{font-size:13px;color:var(--mute);background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:16px}
.auth{max-width:460px;margin:0 auto}.auth .f{margin-bottom:12px}.err{color:var(--bad);min-height:22px;font-size:14px;margin:6px 0}
summary{cursor:pointer;font-size:13px;color:var(--mute)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:14px;box-shadow:0 6px 14px -6px rgba(107,45,92,.6)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

function toast(m){var e=g("toast");e.textContent=m;e.className="toast on";setTimeout(function(){e.className="toast"},1800)}
function opts(arr,sel,ph){return (ph?'<option value="">'+ph+'</option>':'')+arr.map(function(a){return '<option'+(a===sel?' selected':'')+'>'+esc(a)+'</option>'}).join("")}
/* 시·도 → 시·군·구 → 동 3단계 선택 */
function reg(p,v,any){v=v||{};var ph=any?"전체":"선택",gs=R[v.area]?Object.keys(R[v.area]):[],ds=(R[v.area]&&R[v.area][v.gu])||[];
 return '<div class="reg" data-reg="'+p+'"><div><label for="'+p+'-a">시·도</label><select id="'+p+'-a">'+opts(Object.keys(R),v.area,ph)+'</select></div><div><label for="'+p+'-g">시·군·구</label><select id="'+p+'-g"'+(gs.length?'':' disabled')+'>'+opts(gs,v.gu,ph)+'</select></div><div><label for="'+p+'-d">동·읍·면</label><input id="'+p+'-d" list="'+p+'-dl" autocomplete="off" maxlength="20" placeholder="'+(any?"전체 (선택·입력)":"선택하거나 직접 입력")+'" value="'+esc(v.dong||"")+'"'+(v.gu?'':' disabled')+'><datalist id="'+p+'-dl">'+ds.map(function(x){return '<option value="'+esc(x)+'">'}).join("")+'</datalist></div></div>'}
function rd(p){return{area:g(p+"-a").value,gu:g(p+"-g").value,dong:g(p+"-d").value}}
function fill(p,l,arr){if(l==="d"){g(p+"-dl").innerHTML=arr.map(function(x){return '<option value="'+esc(x)+'">'}).join("");var i=g(p+"-d");i.value="";i.disabled=!g(p+"-g").value;return}
 var s=g(p+"-"+l);s.innerHTML=opts(arr,"",p==="mf"?"전체":"선택");s.disabled=!arr.length}
function score(t,r){var wd=new Date(r.date+"T00:00:00").getDay(),a=0,why=[];
 if(t.skills.indexOf(r.type)>-1){a+=50;why.push("종목 일치")}
 if(t.area===r.area){a+=20;why.push("지역 일치");if(t.gu&&t.gu===r.gu){a+=10;why.push("구 일치")}}
 if(r.kind==="job"){a+=20}else if(t.days.indexOf(wd)>-1){a+=20;why.push("요일 가능")}
 return{s:a,why:why.join(" · ")}}
function head(r){return (r.kind==="job"?"[구인·"+(r.jt||"")+"] 마감 "+dlabel(r.date):"[대강] "+dlabel(r.date)+" "+r.time)+" · "+ICON[r.type]+" "+r.type}
function stars(n){return "★★★★★".slice(0,n)+"☆☆☆☆☆".slice(0,5-n)}
function rate(c){var l=S.reviews.filter(function(v){return v.center===c});return l.length?'<span class="tag">★ '+(l.reduce(function(a,v){return a+v.rating},0)/l.length).toFixed(1)+' ('+l.length+')</span>':''}
function revMini(c){var l=S.reviews.filter(function(v){return v.center===c});return l.length?'<details class="sub"><summary>후기 '+l.length+'개 보기</summary>'+l.slice(0,5).map(function(v){return '<p style="margin:8px 0"><strong>'+stars(v.rating)+'</strong> <span class="mute">'+esc(v.by)+'</span><br>'+esc(v.text)+'</p>'}).join("")+'</details>':''}
function revList(c){var l=S.reviews.filter(function(v){return v.center===c});return '<h2 style="margin-top:18px">받은 후기</h2>'+(l.length?l.map(function(v){return '<div class="card"><strong>'+stars(v.rating)+'</strong> <span class="mute">'+esc(v.by)+' · '+dlabel(v.date)+'</span><div>'+esc(v.text)+'</div></div>'}).join(""):'<div class="empty">아직 받은 후기가 없습니다. 체험에 참여한 회원이 후기를 남기면 여기에 표시돼요.</div>')}
function tags(o){return '<span class="tag">'+esc(loc(o))+'</span>'+(o.form?'<span class="tag">'+esc(o.form)+'</span>':'')}

function board(){
 var h="",c=S.center;
 if(S.role==="center"){
  h+='<div class="card"><h2>센터 정보</h2><div class="grid"><div><label for="c-n">센터 이름</label><input id="c-n" maxlength="20" value="'+esc(c.name)+'" placeholder="예: 효필라테스 삼성 본점"></div><div><label for="c-l">대표 필라테스 종류</label><select id="c-l">'+TYPES.map(function(t){return '<option value="'+t+'"'+(t===c.type?' selected':'')+'>'+ICON[t]+' '+t+'</option>'}).join("")+'</select></div><div><label for="c-f">대표 수업 형태</label><select id="c-f">'+opts(FORMS,c.form)+'</select></div><div><label for="c-b">사업자등록번호 (구인 공고용)</label><input id="c-b" maxlength="12" value="'+esc(c.biz)+'" placeholder="000-00-00000"></div></div><label style="margin-top:8px">센터 위치</label>'+reg("cl",c)+'</div>';
  h+='<div class="card"><h2>공고 올리기 (대강·구인)</h2><div class="grid">'+
   '<div><label for="f-date">날짜</label><input id="f-date" type="date" value="'+plus(1)+'"></div>'+
   '<div><label for="f-time">시작 시간</label><input id="f-time" type="time" value="19:00"></div>'+
   '<div><label for="f-kind">구분</label><select id="f-kind"><option value="sub">대강</option><option value="job">구인</option></select></div><div><label for="f-jt">근무 형태(구인)</label><select id="f-jt"><option>시간제</option><option>정규직</option><option>프리랜서</option></select></div><div><label for="f-type">필라테스 종류</label><select id="f-type">'+opts(TYPES,c.type)+'</select></div><div><label for="f-form">수업 형태</label><select id="f-form">'+opts(FORMS,c.form)+'</select></div>'+
   '<div><label for="f-pay">단가·급여(원)</label><input id="f-pay" type="number" min="0" step="1000" value="45000"></div></div>'+
   '<label style="margin-top:8px">수업 지역</label>'+reg("pr",c)+
   '<div style="margin-top:10px"><label for="f-note">수업 설명</label><input id="f-note" maxlength="60" placeholder="예: 기구 필라테스 초급 클래스"></div>'+
   '<p style="margin:12px 0 0"><button class="btn" data-act="post">요청 올리기</button></p></div>';
  var mine=S.reqs.filter(function(r){return r.mine});
  h+="<h2>내 센터의 요청</h2>";
  if(!mine.length)h+='<div class="empty">아직 올린 요청이 없습니다. 위에서 첫 대강 요청을 올려 보세요.</div>';
  mine.forEach(function(r){h+=reqCenter(r)});
 }else{
  var me=T(S.me)||S.teachers[0];
  h+='<div class="card"><div class="row"><div>'+(S.user?'<strong>'+esc(me.name)+'</strong>':'<label for="f-me">내 프로필(시연)</label><select id="f-me" style="min-width:190px">'+S.teachers.map(function(t){return '<option value="'+t.id+'"'+(t.id===S.me?' selected':'')+'>'+esc(t.name)+'</option>'}).join("")+'</select>')+'</div>'+
   '<div class="mute">'+esc(me.exp)+' · '+esc(me.skills.join(", "))+' · '+esc(loc(me))+(me.badge?' · <span class="tag ok">경력 인증</span>':'')+'</div></div></div>';
  h+='<p style="margin:0 0 12px"><button class="btn ghost sm" data-act="editp">'+(S.edit?'닫기':'프로필 수정')+'</button>'+(S.user?'':' <button class="btn ghost sm" data-act="newt">새 강사로 등록</button>')+'</p>';
  if(S.edit){h+='<div class="card"><h2>프로필 수정</h2><div class="grid"><div><label for="e-n">이름</label><input id="e-n" maxlength="10" value="'+esc(me.name)+'"></div><div><label for="e-x">경력</label><input id="e-x" maxlength="20" value="'+esc(me.exp)+'"></div></div><label style="margin-top:8px">활동 지역</label>'+reg("ep",me)+'<div style="margin-top:10px"><label>가능 필라테스 종류</label>'+TYPES.map(function(t){return '<label class="chk"><input type="checkbox" class="e-s" value="'+t+'"'+(me.skills.indexOf(t)>-1?' checked':'')+'>'+t+'</label>'}).join("")+'</div><div style="margin-top:8px"><label>가능 요일</label>'+DAYS.map(function(d,i){return '<label class="chk"><input type="checkbox" class="e-d" value="'+i+'"'+(me.days.indexOf(i)>-1?' checked':'')+'>'+d+'</label>'}).join("")+'</div><p style="margin:12px 0 0"><button class="btn" data-act="savep">저장</button></p></div>'}
  h+="<h2>열려 있는 공고 (대강·구인)</h2>";
  var open=S.reqs.filter(function(r){return !r.chosen});
  if(!open.length)h+='<div class="empty">열려 있는 공고가 없습니다.</div>';
  open.sort(function(a,b){return score(me,b).s-score(me,a).s}).forEach(function(r){
   var sc=score(me,r),done=r.apps.indexOf(me.id)>-1;
   h+='<div class="card"><div class="row"><div><strong>'+head(r)+'</strong><div class="tags">'+tags(r)+(sc.s>=80?'<span class="tag hot">나와 잘 맞음</span>':'')+'<span class="tag">지원 '+r.apps.length+'명</span></div>'+(r.note?'<div class="mute">'+esc(r.note)+'</div>':'')+'</div>'+
   '<div style="text-align:right"><div class="pay">'+won(r.pay)+'</div><button class="btn sm" data-act="apply" data-id="'+r.id+'">'+(done?'지원 취소':'지원하기')+'</button></div></div>'+
   '<div class="mute" style="margin-top:6px">맞춤 점수 '+sc.s+'점'+(sc.why?' ('+sc.why+')':'')+'</div></div>'});
 }
 return h}

function reqCenter(r){
 var h='<div class="card"><div class="row"><div><strong>'+head(r)+'</strong><div class="tags">'+tags(r)+
  (r.chosen?'<span class="tag ok">확정 · '+esc(T(r.chosen).name)+'</span>':'<span class="tag hot">구하는 중</span>')+'</div>'+(r.note?'<div class="mute">'+esc(r.note)+'</div>':'')+'</div>'+
  '<div style="text-align:right"><div class="pay">'+won(r.pay)+'</div><button class="btn ghost sm" data-act="del" data-id="'+r.id+'">삭제</button></div></div>';
 if(r.chosen){
  h+='<div class="sub row"><span class="mute">수업 후 정산 목록에 넣으면 월말 정산에 합산됩니다.</span><button class="btn sm" data-act="addpay" data-id="'+r.id+'"'+(r.added||r.kind==="job"?' disabled':'')+'>'+(r.added?'정산에 추가됨':'정산에 추가')+'</button></div>'
 }else{
  h+='<div class="sub"><div class="row"><strong style="font-size:14px">지원한 강사 '+r.apps.length+'명</strong><button class="btn ghost sm" data-act="copy" data-id="'+r.id+'">급구 알림 문구 복사</button></div>';
  if(!r.apps.length)h+='<div class="mute">아직 지원자가 없습니다. 아래 추천 강사를 확인해 보세요.</div>';
  r.apps.forEach(function(id){var t=T(id);if(!t)return;h+='<div class="rec"><span>'+esc(t.name)+' · '+esc(t.exp)+(t.badge?' <span class="tag ok">인증</span>':'')+'</span><button class="btn sm" data-act="pick" data-id="'+r.id+'" data-t="'+id+'">확정</button></div>'});
  var rec=S.teachers.map(function(t){return{t:t,sc:score(t,r)}}).filter(function(x){return x.sc.s>=50&&r.apps.indexOf(x.t.id)<0}).sort(function(a,b){return b.sc.s-a.sc.s}).slice(0,3);
  h+='<div style="margin-top:8px"><strong style="font-size:14px">추천 강사</strong>';
  if(!rec.length)h+='<div class="mute">조건에 맞는 강사가 아직 없습니다.</div>';
  rec.forEach(function(x){h+='<div class="rec"><span>'+esc(x.t.name)+' <span class="mute">'+x.sc.why+'</span></span><span>'+x.sc.s+'점<span class="bar"><i style="width:'+x.sc.s+'%"></i></span></span></div>'});
  h+='</div></div>'}
 return h+'</div>'}

function tcard(t,own){var left=t.seats-t.apps.length,done=S.member&&t.apps.indexOf(S.member)>-1;
 return '<div class="card"><div class="row"><div><strong>'+ICON[t.type]+' '+t.type+' 체험 · '+esc(t.center)+'</strong><div class="tags">'+tags(t)+rate(t.center)+'<span class="tag">'+dlabel(t.date)+' '+t.time+'</span><span class="tag'+(left>0?' hot':'')+'">'+(left>0?'남은 자리 '+left:'마감')+'</span></div></div><div style="text-align:right"><div class="pay">'+(t.price?won(t.price):'무료')+'</div>'+
  (own?'<button class="btn ghost sm" data-act="deltrial" data-id="'+t.id+'">삭제</button>':'<button class="btn ghost sm" data-act="fav" data-id="'+t.id+'">'+(S.favs.indexOf(t.id)>-1?'♥ 찜함':'♡ 찜')+'</button> <button class="btn sm" data-act="tapply" data-id="'+t.id+'"'+(left<1&&!done?' disabled':'')+'>'+(done?'신청 취소':'체험 신청')+'</button>')+'</div></div>'+
  (own?'<div class="sub mute">신청자 '+t.apps.length+'명'+(t.apps.length?': '+t.apps.map(esc).join(", "):'')+'</div>':revMini(t.center))+'</div>'}
function trial(){var h="",c=S.center,l,f=S.f;
 if(S.role==="center"){
  h+='<div class="card"><h2>체험 클래스 등록</h2><div class="grid"><div><label for="t-d">날짜</label><input id="t-d" type="date" value="'+plus(2)+'"></div><div><label for="t-t">시작 시간</label><input id="t-t" type="time" value="11:00"></div><div><label for="t-ty">필라테스 종류</label><select id="t-ty">'+opts(TYPES,c.type)+'</select></div><div><label for="t-f">수업 형태</label><select id="t-f">'+opts(FORMS,c.form)+'</select></div><div><label for="t-p">체험가(원, 0은 무료)</label><input id="t-p" type="number" min="0" step="1000" value="15000"></div><div><label for="t-s">정원</label><input id="t-s" type="number" min="1" max="30" value="6"></div></div><label style="margin-top:8px">체험 지역</label>'+reg("tr",c)+'<p style="margin:12px 0 0"><button class="btn" data-act="addtrial">체험 올리기</button></p></div><h2>내 체험 클래스와 신청자</h2>';
  l=S.trials.filter(function(t){return t.mine});
  if(!l.length)h+='<div class="empty">아직 올린 체험이 없습니다.</div>';
  l.forEach(function(t){h+=tcard(t,true)});h+=revList(S.center.name||"내 센터");
 }else{
  h+='<div class="card"><div class="grid">'+(S.user?'':'<div><label for="m-n">내 이름 (체험 신청용)</label><input id="m-n" maxlength="10" value="'+esc(S.member)+'" placeholder="예: 홍길동"></div>')+'<div><label for="m-t">필라테스 종류</label><select id="m-t">'+opts(["전체"].concat(TYPES),f.type)+'</select></div><div><label for="m-f">수업 형태</label><select id="m-f">'+opts(["전체"].concat(FORMS),f.form)+'</select></div></div>'+reg("mf",f,true)+'</div><h2>체험 클래스 찾기</h2>';
  l=S.trials.filter(function(t){return (f.type==="전체"||t.type===f.type)&&(f.form==="전체"||t.form===f.form)&&(!f.area||t.area===f.area)&&(!f.gu||t.gu===f.gu)&&(!f.dong||t.dong===f.dong)}).sort(function(a,b){return a.date+a.time<b.date+b.time?-1:1});
  if(!l.length)h+='<div class="empty">조건에 맞는 체험이 없습니다. 지역이나 수업 형태를 넓혀 보세요.</div>';
  l.forEach(function(t){h+=tcard(t,false)});
 }
 return h}
function pay(){
 var rows=S.sess.filter(function(s){return s.date.slice(0,7)===S.month}).sort(function(a,b){return a.date<b.date?-1:1});
 var h='<div class="card"><h2>수업 기록 추가</h2><div class="grid">'+
  '<div><label for="p-t">강사</label><select id="p-t">'+S.teachers.map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+'</option>'}).join("")+'</select></div>'+
  '<div><label for="p-d">날짜</label><input id="p-d" type="date" value="'+plus(0)+'"></div>'+
  '<div><label for="p-n">수업</label><input id="p-n" maxlength="30" placeholder="예: 그룹 필라테스"></div>'+
  '<div><label for="p-p">단가(원)</label><input id="p-p" type="number" min="0" step="1000" value="40000"></div></div>'+
  '<p style="margin:12px 0 0"><button class="btn" data-act="addsess">기록하기</button></p></div>';
 h+='<div class="row" style="margin-bottom:10px"><h2 style="margin:0">월별 정산</h2><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><input type="month" id="p-m" value="'+S.month+'" aria-label="정산 월" style="width:auto">'+
  '<label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--ink)"><input type="checkbox" id="p-tax" style="width:auto"'+(S.tax?' checked':'')+'>3.3% 공제 계산</label></div></div>';
 if(!rows.length){return h+'<div class="empty">이 달의 수업 기록이 없습니다. 위에서 수업을 기록하거나 확정된 대강을 정산에 추가하세요.</div>'}
 var by={};rows.forEach(function(s){(by[s.tid]=by[s.tid]||[]).push(s)});
 h+='<div class="card scroll"><table><thead><tr><th>강사</th><th class="n">수업 수</th><th class="n">총액</th>'+(S.tax?'<th class="n">공제(3.3%)</th><th class="n">실지급</th>':'')+'</tr></thead><tbody>';
 var tot=0,totn=0;
 Object.keys(by).forEach(function(id){var sum=by[id].reduce(function(a,s){return a+s.pay},0),tx=S.tax?Math.round(sum*0.033):0;tot+=sum;totn+=sum-tx;
  h+='<tr><td>'+esc((T(id)||{name:"(삭제된 강사)"}).name)+'</td><td class="n">'+by[id].length+'</td><td class="n">'+won(sum)+'</td>'+(S.tax?'<td class="n">'+won(tx)+'</td><td class="n"><strong>'+won(sum-tx)+'</strong></td>':'')+'</tr>'});
 h+='</tbody><tfoot><tr><th>합계</th><th class="n">'+rows.length+'</th><th class="n">'+won(tot)+'</th>'+(S.tax?'<th class="n">'+won(tot-totn)+'</th><th class="n">'+won(totn)+'</th>':'')+'</tr></tfoot></table></div>';
 h+='<div class="card scroll"><h2>수업 내역</h2><table><thead><tr><th>날짜</th><th>강사</th><th>수업</th><th class="n">단가</th><th></th></tr></thead><tbody>'+
  rows.map(function(s){return '<tr><td>'+dlabel(s.date)+'</td><td>'+esc((T(s.tid)||{name:"-"}).name)+'</td><td>'+esc(s.title)+'</td><td class="n">'+won(s.pay)+'</td><td><button class="btn ghost sm" data-act="delsess" data-id="'+s.id+'" aria-label="기록 삭제">삭제</button></td></tr>'}).join("")+'</tbody></table></div>';
 return h}

function my(){var u=S.user,h='<h2>마이페이지</h2><div class="card"><strong>'+esc(u.name)+'</strong> <span class="tag hot">'+ROLE[u.role]+'</span><div class="mute">'+esc(u.mail)+'</div></div>';
